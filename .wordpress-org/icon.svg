<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>NoticePulse</title>
  <defs>
    <linearGradient id="np-bell" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4b3a93"/>
      <stop offset="0.45" stop-color="#312663"/>
      <stop offset="1" stop-color="#2a2057"/>
    </linearGradient>
    <linearGradient id="np-wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3a5"/>
    </linearGradient>
    <style>
      @keyframes npwIn  { 0%,100% { opacity:.65; transform:scale(.97); } 50% { opacity:1;  transform:scale(1.03); } }
      @keyframes npwOut { 0%,100% { opacity:.22; transform:scale(.97); } 50% { opacity:.6; transform:scale(1.06); } }
      .np-wave     { transform-box: fill-box; transform-origin: center; }
      .np-wave-in  { animation: npwIn  2.6s ease-in-out infinite; }
      .np-wave-out { animation: npwOut 2.6s ease-in-out infinite .55s; }
      @media (prefers-reduced-motion: reduce) { .np-wave { animation: none; } }
    </style>
  </defs>

  <!-- Pulse waves (animated) -->
  <g fill="none" stroke="url(#np-wave)" stroke-linecap="round">
    <path class="np-wave np-wave-out" d="M226 58 a 76 76 0 0 1 0 108" stroke-width="11"/>
    <path class="np-wave np-wave-out" d="M30 166 a 76 76 0 0 1 0 -108" stroke-width="11"/>
    <path class="np-wave np-wave-in"  d="M202 80 a 48 48 0 0 1 0 64"  stroke-width="12"/>
    <path class="np-wave np-wave-in"  d="M54 144 a 48 48 0 0 1 0 -64"  stroke-width="12"/>
  </g>

  <!-- Bell (#312663 prominent) -->
  <path fill="url(#np-bell)" d="M128 44
    c -34 0 -58 27 -58 61
    c 0 26 -5 40 -17 54
    c -8 9 -2 21 11 21
    h 128
    c 13 0 19 -12 11 -21
    c -12 -14 -17 -28 -17 -54
    c 0 -34 -24 -61 -58 -61 z"/>
  <path fill="url(#np-bell)" d="M106 188 h44 c 0 13 -10 23 -22 23 c -12 0 -22 -10 -22 -23 z"/>
</svg>
